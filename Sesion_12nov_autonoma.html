<!doctype html>
<html lang="es">
<head>

<title>Sesión autónoma · Carta de Smith</title>
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1b1e27;--muted:#5c6070;--line:#e2ded3;--navy:#1F3864;--acc:#C1571B;--blue:#1F5FBF;--green:#2E7D32;--red:#B3261E;--purple:#6A3D9A;--soft:#EEF3FA}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",Helvetica,sans-serif;line-height:1.42;font-size:14.5px}
.top{display:flex;align-items:baseline;gap:14px;padding:8px 14px 4px;flex-wrap:wrap}
.top h1{font-family:"Century Gothic",Questrial,Arial,sans-serif;color:var(--navy);font-size:20px;margin:0}
.top .eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc);font-weight:700}
.main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:4px 14px 10px;height:calc(100vh - 44px)}
.left{display:flex;flex-direction:column;align-items:center}
canvas{display:block;border-radius:10px;background:#fff;border:1px solid var(--line)}
.right{display:flex;flex-direction:column;gap:8px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px}
.enun{font-size:13px;line-height:1.35}
.enun h2{font-family:"Century Gothic",Questrial,Arial,sans-serif;color:var(--navy);font-size:15px;margin:0 0 3px}
.stepc{flex:1;min-height:0;overflow:auto}
.stepc h3{color:var(--navy);font-size:16px;margin:2px 0 6px}.stepc p{margin:6px 0}

.ans{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.ans input[type=text]{font:inherit;font-size:15px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:150px}
button{font:inherit;font-size:13.5px;font-weight:700;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 12px;cursor:pointer}
button.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
button:disabled{opacity:.45;cursor:not-allowed}
.fb{margin-top:6px;font-size:13.5px}
.fb.no{color:var(--red)}
.box{border-left:4px solid var(--acc);background:var(--soft);padding:6px 11px;border-radius:6px;margin:6px 0;font-size:13.5px}
.box.tip{border-color:var(--blue)} .box.err{border-color:var(--red)}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:4px}.prog .small{white-space:nowrap}.bar{flex:1;height:6px;background:var(--line);border-radius:4px;overflow:hidden}.eqp{float:right;font-size:12px;color:var(--muted);font-weight:400}
.bar i{display:block;height:100%;background:var(--green);width:0}
.small{font-size:12.5px;color:var(--muted)}
.res{font-size:12.5px;margin:0;padding:0;list-style:none;max-height:76px;overflow:auto}.res b{color:var(--navy)}.res .sep{color:var(--acc);font-weight:700;padding:0 3px}
.res li{padding:1px 0;break-inside:avoid}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
textarea{width:100%;height:120px;font-family:Consolas,monospace;font-size:11.5px;border:1px solid var(--line);border-radius:8px;padding:6px}
label.f{display:block;font-size:13.5px;margin:6px 0 2px}
input.f{font:inherit;font-size:14px;padding:6px 9px;border:1px solid var(--line);border-radius:8px;width:100%}
.c1{color:var(--acc);font-weight:700}.c2{color:var(--purple);font-weight:700}.c3{color:var(--red);font-weight:700}.cb{color:var(--blue);font-weight:700}.cg{color:var(--green);font-weight:700}
a{color:var(--blue)}
@media (max-width:900px){.main{grid-template-columns:1fr;height:auto}.left{order:0}}
#reset{margin-left:auto;font-size:11px;font-weight:400;padding:2px 8px;color:var(--muted);background:transparent}
.tools{display:flex;gap:5px;align-items:center;height:30px;margin-bottom:4px;width:100%}.tools button{font-size:12px;padding:3px 9px}.tools button.on{background:var(--navy);color:#fff;border-color:var(--navy)}.tools .gap{flex:1}.tools[hidden]{display:none}canvas.pen{cursor:crosshair;touch-action:none}
</style>
</head>

var STEPS=[
 /* ---------- Parte 0: diapositivas ---------- */
 {p:"T",k:"s",t:"Paso 0 · Repaso: Γ es un número complejo, es decir, un punto",x:"El <b>coeficiente de reflexión</b> Γ compara, en un punto de la línea, el voltaje de la onda reflejada con el de la onda incidente: Γ = V<sup>−</sup>/V<sup>+</sup>. Es un número complejo, Γ = u + jv (u: parte real; v: parte imaginaria), y se dibuja como el punto de coordenadas (u, v). <b>|Γ|</b> = √(u² + v²) es su distancia al origen y su ángulo θ se mide desde el semieje real positivo, en sentido antihorario. Si la carga no entrega energía (carga pasiva, R ≥ 0), la onda reflejada nunca supera a la incidente: <b>|Γ| ≤ 1</b>. Todos los valores posibles caben en el círculo de radio 1.",c:"Γ = u + jv = |Γ| e<sup>jθ</sup>, &nbsp; |Γ| ≤ 1",d:function(ch){ch.plane();var g=[0.45,0.3];ch.seg([0,0],g,RED,2.5);ch.angArc(g,RED,0.2);ch.dot(g,ORA,"Γ = u + jv",10,-10);ch.txt("θ",ch.cx+0.23*ch.R,ch.cy-0.05*ch.R,15,RED);ch.txt("|Γ|",ch.cx+0.16*ch.R,ch.cy-0.2*ch.R,15,RED);}},
 {p:"T",k:"s",t:"Paso 1 · Normalizar y escribir z en función de Γ",x:"<b>Z</b> es la impedancia (en Ω) en un punto de la línea; en la carga vale Z<sub>L</sub>. <b>Z<sub>0</sub></b> es la <b>impedancia característica</b> de la línea: el cociente V<sup>+</sup>/I<sup>+</sup> de una onda que viaja en un solo sentido. Depende solo del cable (50 Ω en un coaxial RG-58). Llamamos <b>impedancia normalizada</b> a z = Z/Z<sub>0</sub> = r + jx (r: resistencia normalizada; x: reactancia normalizada). No tiene unidades, y por eso una sola carta sirve para cualquier línea. El 5 de noviembre obtuvimos Γ = (Z − Z<sub>0</sub>)/(Z + Z<sub>0</sub>); al dividir numerador y denominador entre Z<sub>0</sub> queda Γ = (z − 1)/(z + 1). Despejamos z: Γ(z + 1) = z − 1 ⇒ 1 + Γ = z(1 − Γ).",c:"z = r + jx = (1 + Γ)/(1 − Γ)",d:function(ch){ch.plane();ch.dot([0,0],GRN,"Γ = 0 ⇔ z = 1",12,-14);ch.dot([-1,0],BLU,"Γ = −1 ⇔ z = 0",14,30);ch.dot([1,0],BLU,"Γ = 1 ⇔ z → ∞",-14,30,"right");}},
 {p:"T",k:"s",t:"Paso 2 · Separar parte real e imaginaria",x:"Sustituimos Γ = u + jv en z = (1 + Γ)/(1 − Γ) y multiplicamos numerador y denominador por el conjugado del denominador, (1 − u) + jv. Al igualar partes reales e imaginarias obtenemos qué resistencia normalizada r y qué reactancia normalizada x corresponden a cada punto (u, v) del plano.",c:"r = (1 − u² − v²)/((1 − u)² + v²), &nbsp;&nbsp; x = 2v/((1 − u)² + v²)",d:function(ch){ch.plane();ch.dot([0.4,0.2],ORA,"(u, v)");}},
 {p:"T",k:"s",t:"Paso 3 · Los puntos con el mismo r forman un círculo",x:"Fijamos un valor de la resistencia normalizada r y buscamos todos los puntos (u, v) que lo cumplen. Pasando el denominador, agrupando y completando el cuadrado en u obtenemos un círculo con centro en el eje real. r = 0 es la circunferencia exterior (|Γ| = 1); r = 1 pasa por el origen; al crecer r los círculos se encogen hacia el punto (1, 0).",c:"(u − r/(1 + r))² + v² = (1/(1 + r))²",d:function(ch){ch.plane();[[0,"#555"],[0.5,ORA],[1,ORA],[2,ORA],[5,ORA]].forEach(function(q){if(q[0]>0)ch.rlab(q[0],q[1]);});ch.txt("r = 0",ch.cx-ch.R*0.707-10,ch.cy-ch.R*0.707-8,14,"#333","right");}},
 {p:"T",k:"s",t:"Paso 4 · Los puntos con el mismo x forman arcos",x:"Ahora fijamos la reactancia normalizada x. Con la segunda expresión y completando el cuadrado en v obtenemos círculos con centro (1, 1/x); solo vemos el arco que queda dentro de |Γ| ≤ 1. Arriba del eje real x > 0: carga <b>inductiva</b> (un inductor tiene X = ωL > 0). Abajo x < 0: carga <b>capacitiva</b> (un capacitor tiene X = −1/(ωC) < 0). El eje real es x = 0: impedancia puramente resistiva.",c:"(u − 1)² + (v − 1/x)² = (1/x)²",d:function(ch){ch.plane();[0.5,1,2].forEach(function(v){ch.xlab(v,PUR);ch.xlab(-v,PUR);});ch.rlab(1,"rgba(193,87,27,.5)");}},
 {p:"T",k:"s",t:"Paso 5 · Leer la carta: cinco lugares que conviene memorizar",x:"<b>Centro</b>: Γ = 0, z = 1, es decir Z = Z<sub>0</sub> (carga adaptada: no hay onda reflejada). <b>Extremo izquierdo</b> del eje real: z = 0 (cortocircuito). <b>Extremo derecho</b>: z → ∞ (circuito abierto). <b>Circunferencia exterior</b>: |Γ| = 1, r = 0, solo reactancia (reflexión total). <b>Mitad superior</b>: inductiva; <b>mitad inferior</b>: capacitiva.",c:"carta de Smith = plano de Γ con la rejilla de r y x dibujada encima",d:function(ch){full(ch);ch.dot([0,0],GRN,"z = 1");ch.dot([-1,0],BLU,"z = 0 (corto)",12,-14);ch.dot([1,0],BLU,"z → ∞ (abierto)",-12,-14,"right");ch.txt("x > 0: inductiva",ch.cx-ch.R*0.35,ch.cy-ch.R*0.6,15,PUR,"center");ch.txt("x < 0: capacitiva",ch.cx-ch.R*0.35,ch.cy+ch.R*0.65,15,PUR,"center");}},
 {p:"T",k:"s",t:"Paso 6 · Alejarse de la carga es girar en sentido horario",x:"Sea <b>d</b> la distancia medida desde la carga hacia el <b>generador</b> (la fuente que alimenta la línea), <b>λ</b> la longitud de onda en la línea y <b>β = 2π/λ</b> la constante de fase. A la distancia d, Γ(d) = Γ e<sup>−j2βd</sup>: el tamaño no cambia y el ángulo disminuye 2βd = 4πd/λ rad = 720°·d/λ. Disminuir el ángulo es girar en sentido horario. Media vuelta son λ/4 y una vuelta completa λ/2. Por eso la <b>escala exterior</b> («longitudes de onda hacia el generador») va de 0 a 0.5: empieza en el extremo izquierdo y crece en sentido horario.",c:"Γ(d) = Γ e<sup>−j2βd</sup>, &nbsp; giro = 720° · d/λ",d:function(ch){full(ch);var g=[0.3,0.4];ch.scircle(mag(g),"rgba(31,95,191,.5)");ch.rotArc(g,0.15,GRN);ch.dot(g,ORA,"carga");ch.dot(rot(g,0.15),GRN,"d = 0.15λ",8,16);}},
 {p:"T",k:"s",t:"Paso 7 · El círculo de S y los extremos de voltaje",x:"La onda incidente y la reflejada se suman: |V(d)| = |V<sup>+</sup>|·|1 + Γ(d)| tiene máximos y mínimos a lo largo de la línea (onda estacionaria). Su cociente es la <b>razón de onda estacionaria</b> S = |V|<sub>máx</sub>/|V|<sub>mín</sub> = (1 + |Γ|)/(1 − |Γ|). Como |Γ(d)| no cambia, el punto recorre el círculo de radio |Γ| centrado en Γ = 0: el <b>círculo de S</b>. |V| es máximo donde Γ(d) es real positivo (eje real a la derecha; ahí r = S) y mínimo donde es real negativo (a la izquierda; ahí r = 1/S).",c:"z(V<sub>máx</sub>) = (1 + |Γ|)/(1 − |Γ|) = S, &nbsp; z(V<sub>mín</sub>) = 1/S",d:function(ch){full(ch);var g=[0.3,0.4],m=mag(g);ch.scircle(m,BLU);ch.dot(g,ORA,"carga");ch.realmark(m,BLU,"Vmáx: r = S",true);ch.realmark(-m,BLU,"Vmín: r = 1/S",true);}},
 {p:"T",k:"s",t:"Paso 8 · La receta",x:"1) Normalizar: z<sub>L</sub> = Z<sub>L</sub>/Z<sub>0</sub>. 2) Ubicar el cruce del círculo r con el arco x. 3) Leer |Γ| (distancia al centro, con el radio de la carta igual a 1) y trazar el círculo de S. 4) Prolongar el radio hasta la escala exterior y leer la posición. 5) Girar d/λ en sentido horario. 6) Leer r y x del punto nuevo y multiplicar por Z<sub>0</sub>. 7) Comprobar con la fórmula. Ahora la aplicamos en un ejemplo.",c:"normalizar · ubicar · |Γ| y S · leer la escala · girar · leer y desnormalizar · comprobar",d:function(ch){full(ch);}},
 /* ---------- Parte 1: ejemplo resuelto ---------- */
 {p:"A",k:"n",t:"Ejemplo · Paso 1a · Normalizar: parte real",x:"Dividimos la impedancia compleja entre Z<sub>0</sub>, que es real. Cada parte se divide por separado:",c:"z<sub>L</sub> = Z<sub>L</sub>/Z<sub>0</sub> = (R<sub>L</sub> + jX<sub>L</sub>)/Z<sub>0</sub> = R<sub>L</sub>/Z<sub>0</sub> + j X<sub>L</sub>/Z<sub>0</sub> &nbsp;⇒&nbsp; r = R<sub>L</sub>/Z<sub>0</sub>, &nbsp; x = X<sub>L</sub>/Z<sub>0</sub>",q:"r = R<sub>L</sub>/Z<sub>0</sub> = 100/50 =",v:2,tol:0.02,lab:"r = 2",h:["Divide 100 entre 50."],d:function(ch){full(ch);}},
 {p:"A",k:"n",t:"Ejemplo · Paso 1b · Normalizar: parte imaginaria",x:"Ahora la parte imaginaria, con la misma regla.",c:"x = X<sub>L</sub>/Z<sub>0</sub> = 50/50",q:"x =",v:1,tol:0.02,lab:"x = 1",h:["Divide 50 entre 50."],d:function(ch){full(ch);}},
 {p:"A",k:"c",t:"Ejemplo · Paso 2 · Ubicar la carga",x:"Buscamos el <span class='c1'>círculo r = 2</span> (naranja) y el <span class='c2'>arco x = +1</span> (morado). La carga z<sub>L</sub> = 2 + j1 está en su intersección.",c:"z<sub>L</sub> = 2 + j1: &nbsp;<span class='c1'>círculo r = 2</span> ∩ <span class='c2'>arco x = +1</span>",q:"La intersección está en la mitad superior. ¿La carga es inductiva o capacitiva?",o:["inductiva","capacitiva"],v:"inductiva",lab:"z_L = 2 + j1, inductiva",h:["En la mitad superior x > 0; un inductor tiene X = ωL > 0."],d:function(ch){full(ch);ch.rlab(2,ORA);ch.xlab(1,PUR);ch.dot(A.G,"#1b1e27","z_L",-30,-10);}},
 {p:"A",k:"n",t:"Ejemplo · Paso 3a · Coeficiente de reflexión: tamaño",x:"El punto ubicado es el número complejo Γ. Lo calculamos con la fórmula, multiplicando por el conjugado del denominador:",c:"Γ = (z<sub>L</sub> − 1)/(z<sub>L</sub> + 1) = (1 + j1)/(3 + j1) = (1 + j1)(3 − j1)/10 = (4 + j2)/10",q:"|Γ| (tres cifras) =",v:A.m,tol:0.01,lab:"Γ = 0.4 + j0.2, |Γ| = "+f(A.m),h:["Γ = 0.4 + j0.2; |Γ| = √(0.4² + 0.2²)."],d:function(ch){full(ch);ch.dot(A.G,ORA,"z_L");}},
 {p:"A",k:"n",t:"Ejemplo · Paso 3b · Coeficiente de reflexión: ángulo",x:"El ángulo se mide desde el semieje real positivo (el que va del centro hacia el extremo derecho), en sentido antihorario.",c:"∠Γ = arctan(0.2/0.4)",q:"∠Γ en grados =",v:A.a,tol:0.6,lab:"∠Γ = "+f(A.a,1)+"°",h:["arctan(0.5), con la calculadora en grados."],d:function(ch){full(ch);ch.dot(A.G,ORA,"z_L");}},
 {p:"A",k:"n",t:"Ejemplo · Paso 4 · Razón de onda estacionaria",x:"El <span class='cb'>círculo de S</span> tiene radio |Γ| y centro en Γ = 0. Corta el eje real a la derecha en r = S.",c:"S = (1 + |Γ|)/(1 − |Γ|) = 1.447/0.553",q:"S (tres cifras) =",v:A.S,tol:0.03,lab:"S = "+f(A.S,2),h:["Divide 1.447 entre 0.553."],d:function(ch){full(ch);ch.dot(A.G,ORA,"z_L");}},
 {p:"A",k:"c",t:"Ejemplo · Paso 4b · ¿Qué mide S?",x:"S compara el voltaje máximo con el mínimo a lo largo de la línea: S = |V|<sub>máx</sub>/|V|<sub>mín</sub>. Aquí el máximo es 2.62 veces el mínimo. Cuanto mayor es |Γ|, mayor es el círculo de S y más lejos está la línea de la adaptación.",c:"S = (1 + |Γ|)/(1 − |Γ|), &nbsp; con 0 ≤ |Γ| ≤ 1",q:"Si la carga estuviera adaptada (Z<sub>L</sub> = Z<sub>0</sub>, Γ = 0), ¿cuánto valdría S?",o:["S = 0","S = 1","S → ∞"],v:"S = 1",lab:"carga adaptada: S = 1 (el círculo de S se reduce al centro)",h:["Sustituye |Γ| = 0 en la fórmula: no hay onda reflejada y |V| es igual en toda la línea."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.dot(A.G,ORA,"z_L");ch.realmark(A.m,BLU,"r = S = 2.62",true);}},
 {p:"A",k:"c",t:"Ejemplo · Paso 5a · El centro de la carta",x:"Antes de leer posiciones fijamos el origen de todo: el <span class='cg'>centro</span> de la carta es el punto Γ = 0. Ahí no hay onda reflejada.",c:"Γ = 0 &nbsp;⇔&nbsp; z = (1 + 0)/(1 − 0)",q:"¿Qué impedancia normalizada corresponde al centro?",o:["z = 0","z = 1","z → ∞"],v:"z = 1",lab:"centro: Γ = 0, z = 1",h:["Sustituye Γ = 0 en z = (1 + Γ)/(1 − Γ)."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.dot(A.G,ORA,"z_L");ch.dot([0,0],GRN,"Γ = 0",8,-10);}},
 {p:"A",k:"c",t:"Ejemplo · Paso 5b · El segmento rojo es el vector Γ",x:"El <span class='c3'>segmento rojo</span> va del centro (Γ = 0, z = 1) al punto z<sub>L</sub>: es la flecha del número Γ. Su longitud es |Γ| = 0.447 veces el radio de la carta y su inclinación es ∠Γ = 26.6°. Por eso empieza en el punto marcado «1» sobre el eje real (r = 1, x = 0): ese punto es Γ = 0, el origen del plano de Γ, y no el origen de las impedancias.",c:"segmento del centro a z<sub>L</sub> = Γ = 0.447 ∠ 26.6°",q:"¿Desde qué semieje, partiendo del centro, se mide el ángulo de Γ?",o:["hacia el extremo derecho (abierto)","hacia el extremo izquierdo (corto)"],v:"hacia el extremo derecho (abierto)",lab:"segmento rojo = vector Γ",h:["El ángulo de un número complejo se mide desde el semieje real positivo; en la carta, ese semieje apunta al abierto."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.seg([0,0],A.G,RED,3);ch.angArc(A.G,RED,0.22);ch.dot([0,0],GRN,"");ch.dot(A.G,ORA,"z_L");ch.txt("26.6°",ch.cx+0.25*ch.R,ch.cy-0.05*ch.R,14,RED);}},
 {p:"A",k:"n",t:"Ejemplo · Paso 5c · Prolongar hasta la escala exterior",x:"Prolongamos el segmento rojo (línea punteada) más allá de z<sub>L</sub> hasta la <b>circunferencia exterior</b>, que es |Γ| = 1, y un poco más hasta la <b>escala de longitudes de onda hacia el generador</b>, el anillo numerado de 0 a 0.5 por fuera de la carta. Esa escala vale 0 en el extremo izquierdo (ángulo 180°) y crece en sentido horario a razón de 0.5 λ por vuelta (720° por λ).",c:"lectura = (180° − ∠Γ)/720° · λ = (180° − 26.6°)/720°",q:"Lectura de z<sub>L</sub> en la escala (en λ) =",v:A.w,tol:0.004,lab:"lectura de z_L: "+f(A.w)+" λ",h:["153.4/720."],d:function(ch){full(ch);ch.scircle(A.m,BLU);var u=[A.G[0]/A.m,A.G[1]/A.m];ch.seg([0,0],A.G,RED,3);ch.seg(A.G,[u[0]*1.06,u[1]*1.06],RED,2,[5,4]);ch.dot(A.G,ORA,"z_L");}},
 {p:"A",k:"c",t:"Ejemplo · Paso 6 · ¿Máximo o mínimo primero?",x:"Desde la lectura 0.213 giramos en sentido horario (hacia el generador). El eje real derecho (V<sub>máx</sub>) tiene lectura 0.25; el izquierdo (V<sub>mín</sub>), lectura 0.5 = 0.",c:"d<sub>máx</sub> = 0.25 − 0.213 = "+f(A.dmax)+" λ, &nbsp; d<sub>mín</sub> = d<sub>máx</sub> + 0.25 = "+f(A.dmax+0.25)+" λ",q:"¿Qué encontramos primero al alejarnos de esta carga?",o:["un máximo de voltaje","un mínimo de voltaje"],v:"un máximo de voltaje",lab:"d_máx = "+f(A.dmax)+" λ, d_mín = "+f(A.dmax+0.25)+" λ",h:["0.213 → 0.25 está más cerca que 0.213 → 0.5."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.wmark(A.G,ORA,f(A.w));ch.dot(A.G,ORA,"z_L");ch.realmark(A.m,BLU,"Vmáx",true);ch.realmark(-A.m,BLU,"Vmín",true);}},
 {p:"A",k:"c",t:"Ejemplo · Paso 7a · ¿Qué cambia al alejarnos de la carga?",x:"Queremos la impedancia que se mide a d = λ/8 de la carga. En ese punto, la onda reflejada ha recorrido un tramo adicional de ida (d) y vuelta (d) con respecto a la carga: llega con un retraso de fase 2βd, pero con la misma amplitud, porque la línea no tiene pérdidas.",c:"Γ(d) = Γ e<sup>−j2βd</sup> &nbsp;⇒&nbsp; |Γ(d)| = |Γ|, &nbsp; ∠Γ(d) = ∠Γ − 2βd",q:"Al pasar de la carga al punto d, ¿qué le ocurre al punto que representa a Γ en la carta?",o:["se acerca al centro","gira sobre el círculo de S","no se mueve"],v:"gira sobre el círculo de S",lab:"alejarse de la carga = girar sobre el círculo de S",h:["El tamaño |Γ| no cambia: el punto conserva su distancia al centro. Solo cambia el ángulo."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.seg([0,0],A.G,RED,2.5);ch.wmark(A.G,ORA,f(A.w));ch.dot(A.G,ORA,"z_L");}},
 {p:"A",k:"n",t:"Ejemplo · Paso 7b · ¿Cuánto gira?",x:"El ángulo de giro es el retraso de fase 2βd. Con β = 2π/λ: 2βd = 4π·d/λ radianes = 720°·d/λ. El factor 2 es el recorrido de ida y vuelta: por eso basta avanzar λ/2 para dar una vuelta completa (360°), y no λ.",c:"giro = 2βd = 720° · d/λ, &nbsp; con d/λ = 1/8",q:"Ángulo de giro para d = λ/8 (grados) =",v:90,tol:1,lab:"giro de 90° para d = λ/8",h:["720 × 0.125."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.seg([0,0],A.G,RED,2.5);ch.wmark(A.G,ORA,f(A.w));ch.dot(A.G,ORA,"z_L");}},
 {p:"A",k:"n",t:"Ejemplo · Paso 7c · ¿Hacia dónde gira?",x:"El ángulo de Γ <b>disminuye</b> 90° (signo menos en el exponente). Los ángulos positivos se miden en sentido antihorario; disminuir el ángulo es girar en <span class='cg'>sentido horario</span>. En la carta ese sentido se llama «hacia el generador», porque d crece al alejarnos de la carga rumbo a la fuente.",c:"∠Γ(d) = ∠Γ − 90° = 26.6° − 90°",q:"Nuevo ángulo de Γ (grados, con signo) =",v:A.a-90,tol:1,lab:"∠Γ(λ/8) = "+f(A.a-90,1)+"° (giro horario)",h:["26.6 − 90: el resultado es negativo, el punto queda debajo del eje real."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.seg([0,0],A.G,RED,2.5);ch.rotArc(A.G,0.125,GRN);ch.wmark(A.G,ORA,f(A.w));ch.dot(A.G,ORA,"z_L");}},
 {p:"A",k:"n",t:"Ejemplo · Paso 7d · El mismo giro, leído en la escala exterior",x:"La escala exterior está graduada directamente en d/λ: avanzar d/λ suma d/λ a la lectura, sin convertir a grados. Para trazar el punto sin compás: marcamos la nueva lectura en la escala, la unimos con el centro (<span class='cg'>radio verde</span>) y sobre ese radio medimos con la regla la misma distancia que hay del centro a z<sub>L</sub>.",c:"nueva lectura = lectura de z<sub>L</sub> + d/λ = 0.213 + 0.125",q:"Nueva lectura en la escala (en λ) =",v:A.w+0.125,tol:0.004,lab:"lectura del punto girado: "+f(A.w+0.125)+" λ",h:["Suma directa: 0.213 + 0.125."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.seg([0,0],A.G,RED,2.5);ch.rotArc(A.G,0.125,GRN);ch.seg([0,0],[A.Gd[0]/A.m*1.06,A.Gd[1]/A.m*1.06],GRN,1.6,[5,4]);ch.wmark(A.G,ORA,f(A.w));ch.dot(A.G,ORA,"z_L");}},
 {p:"A",k:"n",t:"Ejemplo · Paso 8a · Leer el punto girado: r",x:"El punto verde es Γ(d), y por lo tanto representa la impedancia normalizada que se mide en ese lugar de la línea: z<sub>in</sub> = (1 + Γ(d))/(1 − Γ(d)). No hace falta calcularla: la leemos en la rejilla, igual que ubicamos z<sub>L</sub> pero al revés. Primero identificamos el círculo de r constante que pasa por el punto (los valores de r están escritos sobre el eje real).",c:"z<sub>in</sub> = r<sub>in</sub> + j x<sub>in</sub>: &nbsp; ¿qué círculo r pasa por el punto verde?",q:"r<sub>in</sub> =",v:1,tol:0.05,lab:"r_in = 1",h:["Es el círculo que pasa por el centro de la carta."],d:function(ch){full(ch);ch.scircle(A.m,BLU);ch.rotArc(A.G,0.125,GRN);ch.seg([0,0],[A.Gd[0]/A.m*1.06,A.Gd[1]/A.m*1.06],GRN,1.6,[5,4]);ch.dot(A.G,ORA,"z_L");ch.dot(A.Gd,GRN,"z_in",10,20);ch.wmark(A.Gd,GRN,"0.338");}},

 if(s.k==="save"){stepEl.innerHTML="<h3>"+s.t+"</h3><p>Antes de guardar revisamos que el trazo contenga: "+s.chk+". Todavía podemos corregirlo con «Deshacer».</p><div class='box'>Al guardar, el trazo queda fijo, se descarga como imagen (.png) y la página muestra encima la construcción correcta para comparar.</div><div class='ans'><button class='pri' id='sv'>Guardar el trazo</button></div><div class='fb no' id='fb'></div>";
  document.getElementById("sv").onclick=function(){var n=((st.draw&&st.draw[s.p])||[]).length;if(n<3){document.getElementById("fb").textContent="El trazo tiene "+n+" elemento(s); se esperan al menos tres (punto de carga, círculo de S y punto final).";return;}st.saved=st.saved||{};st.saved[s.p]=now();st.log.push({p:{E1:"Ejercicio 1",E2:"Ejercicio 2"}[s.p],lab:"trazo guardado ("+n+" elementos)",ans:"trazo",fails:0,rev:false,t:now()});png(s.p);st.i++;save();render();};return;}
 if(s.k==="cmp"){stepEl.innerHTML="<h3>"+s.t+"</h3><p>Nuestro trazo aparece en negro. "+s.x+"</p><div class='box err'><b>Error típico:</b> "+s.err+"</div><div class='ans'><button class='pri' id='cont'>Continuar ›</button></div>";
  document.getElementById("cont").onclick=function(){st.i++;save();render();};return;}
 if(s.k==="fin"){if(!st.fin){st.fin=now();save();}var txt=registro();
  stepEl.innerHTML="<h3>"+s.t+"</h3><p>Elegimos el ejercicio que queremos ver en la carta (trazo en negro, construcción correcta en color).</p><div class='opts'><button id='v1' class='pri'>Ver ejercicio 1</button><button id='v2'>Ver ejercicio 2</button><button id='p1'>Descargar trazo 1 (.png)</button><button id='p2'>Descargar trazo 2 (.png)</button></div><p class='small' style='margin:4px 0'>Entregamos en la tarea de <a href='https://classroom.google.com/c/ODc1MjkxODU3NTU4' target='_blank' rel='noopener'>Classroom</a> las dos imágenes de los trazos y este registro. El código final sirve al docente para detectar cambios en el texto.</p><textarea id='reg' readonly></textarea><div class='ans'><button id='cp'>Copiar registro</button><button id='dl' class='pri'>Descargar registro (.txt)</button><span class='small' id='fbc'></span></div>";
  document.getElementById("reg").value=txt;
  document.getElementById("p1").onclick=function(){png("E1");};document.getElementById("p2").onclick=function(){png("E2");};document.getElementById("v1").onclick=function(){st.view="E1";save();draw();};document.getElementById("v2").onclick=function(){st.view="E2";save();draw();};
  document.getElementById("cp").onclick=function(){var t=document.getElementById("reg");t.select();try{navigator.clipboard.writeText(t.value);}catch(e){document.execCommand("copy");}document.getElementById("fbc").textContent="Registro copiado.";};
  document.getElementById("dl").onclick=function(){var b=new Blob([txt],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="Registro_Smith_12nov_"+st.equipo.replace(/[^A-Za-z0-9]+/g,"_")+".txt";document.body.appendChild(a);a.click();a.remove();};return;}
 var inp=s.k==="n"?"<input type='text' id='in' inputmode='decimal' autocomplete='off'><button class='pri' id='ok'>Comprobar</button>":"<div class='opts'>"+s.o.map(function(o,j){return "<button class='opt' data-j='"+j+"'>"+o+"</button>";}).join("")+"</div>";
 var ej=s.p==="E1"||s.p==="E2",H=ej?[s.c].concat(s.h):s.h,T=ej?[3,4,5]:[2,4,6];
 stepEl.innerHTML="<h3>"+s.t+"</h3><p>"+s.x+"</p>"+(ej?"":"<div class='calc'>"+s.c+"</div>")+"<p style='margin:4px 0'><b>"+s.q+"</b></p><div class='ans'>"+inp+"</div><div class='fb' id='fb'></div><div id='hint'></div>";
 function hints(nf){var h=document.getElementById("hint"),o="";H.forEach(function(t,k){if(t&&nf>=T[k])o+="<div class='box tip'><b>"+["Pista","Segunda pista","Tercera pista"][k]+":</b> "+t+"</div>";});if(nf>=6)o+="<div class='box err'>Después de seis intentos podemos ver el resultado; queda registrado como «revelado». <button id='rev'>Ver el resultado y continuar</button></div>";h.innerHTML=o;var rb=document.getElementById("rev");if(rb)rb.onclick=function(){accept(true);};}
 function accept(rev){st.log.push({p:{A:"Ejemplo",E1:"Ejercicio 1",E2:"Ejercicio 2"}[s.p],lab:s.lab,ans:rev?"(revelado)":st.lastAns,fails:st.fails[st.i]||0,rev:!!rev,t:now()});st.i++;save();render();}
 function wrong(){st.fails[st.i]=(st.fails[st.i]||0)+1;save();var nf=st.fails[st.i],fb=document.getElementById("fb");fb.className="fb no";fb.textContent="Todavía no. Intentos fallidos en este paso: "+nf+".";hints(nf);}
 hints(st.fails[st.i]||0);
 if(s.k==="n"){var go=function(){var raw=document.getElementById("in").value.trim(),v=parseFloat(raw.replace(",",".").replace("−","-"));if(isNaN(v)){document.getElementById("fb").textContent="Escribimos un número.";return;}st.lastAns=raw;if(Math.abs(v-s.v)<=Math.max(s.tol,Math.abs(s.v)*0.03))accept(false);else wrong();};
  document.getElementById("ok").onclick=go;document.getElementById("in").addEventListener("keydown",function(e){if(e.key==="Enter")go();});document.getElementById("in").focus();}
 else stepEl.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){st.lastAns=s.o[+b.dataset.j];if(st.lastAns===s.v)accept(false);else{b.disabled=true;wrong();}};});
}
function registro(){var L=[];L.push("REGISTRO · Sesión autónoma 12 nov · Carta de Smith · Teoría Electromagnética, ENES Juriquilla");L.push("Equipo: "+st.equipo);L.push("Integrantes (números de cuenta): "+st.integrantes);L.push("Inicio: "+st.inicio+" · Trazo 1 guardado: "+((st.saved&&st.saved.E1)||"…")+" · Trazo 2 guardado: "+((st.saved&&st.saved.E2)||"…")+" · Fin: "+(st.fin||"…"));L.push("");L.push("Parte | Resultado aceptado | Respuesta escrita | Intentos fallidos");
 var tot=0,rev=0,n=0;st.log.forEach(function(r){tot+=r.fails;if(r.rev)rev++;if(r.p!=="Teoría")n++;L.push(r.p+" | "+r.lab+" | "+r.ans+" | "+r.fails+(r.rev?" (revelado)":""));});
 L.push("");L.push("Total de intentos fallidos: "+tot+" · Pasos revelados: "+rev+" de "+n);var body=L.join("\n"),h=5381;for(var k=0;k<body.length;k++){h=((h<<5)+h+body.charCodeAt(k))>>>0;}return body+"\nCódigo de verificación: "+h.toString(36).toUpperCase();}

render();
